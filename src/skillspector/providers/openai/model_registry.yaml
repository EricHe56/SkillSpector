# Token-budget metadata for the OpenAIProvider (stock api.openai.com or any
# OpenAI-compatible endpoint via OPENAI_BASE_URL).  Bundled with the
# package; consulted whenever the active provider is OpenAIProvider.
#
# Format:
#   models:
#     "<model-label>":
#       context_length: <int>          # total context window in tokens (required)
#       max_output_tokens: <int>       # model's max output cap (optional)

models:
  "gpt-5.4":
    context_length: 1000000
    max_output_tokens: 128000

  "deepseek-v4-flash":
    context_length: 1000000      # 1M tokens
    max_output_tokens: 384000    # 384K tokens
    input_cost_per_token: 0.00000014   # $0.14 / 1M tokens
    output_cost_per_token: 0.00000028  # $0.28 / 1M tokens

  "deepseek-v4-pro":
    context_length: 1000000      # 1M tokens
    max_output_tokens: 384000    # 384K tokens
    input_cost_per_token: 0.000000435  # $0.435 / 1M tokens
    output_cost_per_token: 0.00000087  # $0.87 / 1M tokens